<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Swap & Charging Rollout — Instamart Pods</title>
<style>
:root{
  --navy:#0b2545; --slate:#13315c; --bg:#f4f6fb; --card:#ffffff;
  --border:#e2e8f0; --text:#1a202c; --muted:#64748b; --muted2:#94a3b8;
  --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --blue:#2563eb; --teal:#0d9488; --grey:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
header{background:linear-gradient(120deg,var(--navy),var(--slate));color:#fff;padding:14px 24px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header h1{font-size:18px;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.8;margin-top:2px}
header .meta{display:flex;gap:14px;align-items:center;font-size:12px;flex-wrap:wrap}
header .meta .chip{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px}
header .meta .btn{background:#fff;color:var(--navy);padding:6px 12px;border-radius:6px;border:0;font-weight:600;cursor:pointer;font-size:12px}
nav.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--border);padding:0 12px;position:sticky;top:55px;z-index:40;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--navy);background:#f8fafc}
nav.tabs button.active{color:var(--navy);border-bottom-color:var(--blue)}
section.tab{display:none;padding:20px 24px 48px;max-width:1400px;margin:0 auto}
section.tab.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .val{font-size:24px;font-weight:700;color:var(--navy);margin-top:3px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .split{font-size:11px;margin-top:4px;display:flex;gap:8px}
.kpi .split .live{color:var(--green)} .kpi .split .upc{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h3 .sow{font-size:11px;font-weight:500;color:var(--muted);text-transform:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.b-live{background:#dcfce7;color:#166534}.b-rollout_ready{background:#ccfbf1;color:#0f766e}
.b-in_progress{background:#dbeafe;color:#1e40af}.b-blocked_noc{background:#fef3c7;color:#92400e}
.b-blocked_vendor{background:#ffedd5;color:#9a3412}.b-not_feasible_power{background:#fee2e2;color:#991b1b}
.b-not_feasible_space{background:#fee2e2;color:#991b1b}.b-not_feasible_both{background:#fee2e2;color:#991b1b}
.b-not_assessed{background:#f1f5f9;color:#64748b}
.b-bangalore_over_40_pending{background:#fef9c3;color:#854d0e}.b-exceeds_max_load{background:#f3f4f6;color:#374151}
.b-within_headroom{background:#dcfce7;color:#166534}.b-tier2_additive{background:#dbeafe;color:#1e40af}
.b-tier2_bundled{background:#dbeafe;color:#1e40af}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;background:#f8fafc}
tbody tr:hover{background:#f8fafc}
.scroll{max-height:380px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef2f7;color:var(--slate);font-weight:600}
.muted{color:var(--muted)} .small{font-size:11px}
.pos{color:var(--green)} .neg{color:var(--red)}

/* tile KPIs (reference format) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 12px;text-align:center;position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--navy)}
.tile.t-universe::before{background:var(--navy)}
.tile.t-assessed::before{background:var(--blue)}
.tile.t-feasible::before{background:var(--teal)}
.tile.t-noc::before{background:var(--amber)}
.tile.t-vendor::before{background:#8b5cf6}
.tile.t-rollout::before{background:var(--green)}
.tile.t-live::before{background:var(--green)}
.tile.t-upcoming::before{background:var(--blue)}
.tile.t-notassessed::before{background:var(--grey)}
.tile.t-oos::before{background:var(--red)}
.tile .t-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.tile .t-big{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.tile .t-split{font-size:12px;font-weight:700;margin-top:6px;display:flex;justify-content:center;gap:2px;align-items:baseline}
.tile .t-split .sl{color:var(--green)}
.tile .t-split .su{color:var(--blue)}
.tile .t-split .sep{color:var(--muted2);font-weight:400}
.tile .t-sub{font-size:10px;color:var(--muted);margin-top:4px}

/* tile KPIs (reference format: horizontal row) */
.kpi-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:8px;align-items:stretch}
.kpi-block{flex:0 0 150px;height:186px;display:flex;flex-direction:column;gap:6px}
.kpi-big{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;text-align:center;position:relative;overflow:hidden;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kpi-big::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--navy)}
.kpi-big.acc-navy::before{background:var(--navy)}.kpi-big.acc-blue::before{background:var(--blue)}
.kpi-big.acc-teal::before{background:var(--teal)}.kpi-big.acc-amber::before{background:var(--amber)}
.kpi-big.acc-purple::before{background:#8b5cf6}.kpi-big.acc-green::before{background:var(--green)}
.kpi-big.acc-grey::before{background:var(--grey)}.kpi-big.acc-red::before{background:var(--red)}
.kpi-big .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.kpi-big .num{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.kpi-big .sub{font-size:10px;color:var(--muted);margin-top:4px}
.kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:64px;flex:0 0 64px}
.kpi-trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;height:64px;flex:0 0 64px}
.kpi-sm{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 4px;text-align:center;height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kpi-sm .slbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.kpi-sm .snum{font-size:18px;font-weight:800;line-height:1}
.kpi-sm.live .slbl{color:var(--green)}.kpi-sm.live .snum{color:var(--green)}
.kpi-sm.upc .slbl{color:var(--blue)}.kpi-sm.upc .snum{color:var(--blue)}
.kpi-sm.red .slbl{color:var(--red)}.kpi-sm.red .snum{color:var(--red)}
/* 2x2 matrix */
.kpi-matrix{flex:0 0 300px;height:186px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px}
.kpi-cell{border:1px solid var(--border);border-radius:8px;padding:6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kpi-cell .clbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.kpi-cell .cnum{font-size:26px;font-weight:800;line-height:1}
.kpi-cell .csplit{font-size:11px;font-weight:700;margin-top:3px}
.kpi-cell .csplit .cl{color:var(--green)}.kpi-cell .csplit .cu{color:var(--blue)}
.kpi-cell .csplit .sep{color:var(--muted2);font-weight:400}
.kpi-cell.live-cell{background:#f0fdf4;border-color:#bbf7d0}.kpi-cell.live-cell .clbl{color:var(--green)}.kpi-cell.live-cell .cnum{color:var(--green)}
.kpi-cell.upc-cell{background:#eff6ff;border-color:#bfdbfe}.kpi-cell.upc-cell .clbl{color:var(--blue)}.kpi-cell.upc-cell .cnum{color:var(--blue)}
.kpi-cell.rej-cell{background:#fef2f2;border-color:#fecaca}.kpi-cell.rej-cell .clbl{color:var(--red)}.kpi-cell.rej-cell .cnum{color:var(--red)}
.kpi-cell.thoda-cell{background:#fffbeb;border-color:#fde68a}.kpi-cell.thoda-cell .clbl{color:#92400e}.kpi-cell.thoda-cell .cnum{color:var(--amber)}

/* approach */
.approach{background:linear-gradient(120deg,#0b2545,#13315c);color:#fff;border-radius:12px;padding:20px 24px;margin-bottom:20px}
.approach h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.approach h2 .num{background:rgba(255,255,255,.18);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.approach .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.approach .step{background:rgba(255,255,255,.08);border-radius:8px;padding:12px;border-left:3px solid rgba(255,255,255,.3)}
.approach .step .sn{font-size:11px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:.5px}
.approach .step .st{font-size:13px;font-weight:600;margin-top:3px}
.approach .step .sd{font-size:11px;opacity:.7;margin-top:3px}
.approach .principle{margin-top:14px;font-size:12px;opacity:.85;font-style:italic;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}

/* svg tree */
.tree-wrap{overflow-x:auto;padding:10px 2px 20px;border-radius:10px}
.tree-wrap svg{display:block}
.tlink{fill:none;stroke:#cbd5e1;stroke-width:2}
.tlink-act{stroke:#94a3b8}
.snode{width:100%;height:100%;border:2px solid;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px 4px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.snode .tname{font-size:10px;font-weight:700;color:var(--navy);line-height:1.1;max-width:100%;word-break:break-word}
.snode .tsub2{font-size:8px;color:var(--muted);font-weight:500;line-height:1.05;margin-top:1px}
.snode .tcount{font-size:18px;font-weight:700;color:var(--navy);margin:1px 0 0}
.snode .tconv{font-size:8px;color:var(--muted);line-height:1.05}
.snode .taction{font-size:8px;font-weight:700;margin-top:2px;padding:1px 6px;border-radius:10px;line-height:1.25;white-space:nowrap}
.snode.root{border-color:var(--navy);background:linear-gradient(135deg,#0b2545,#13315c);color:#fff}
.snode.root .tname{color:#fff}.snode.root .tcount{color:#fff}.snode.root .tconv{color:rgba(255,255,255,.7)}
.snode.assessed{border-color:var(--blue);background:#eff6ff}
.snode.feasible{border-color:var(--teal);background:#f0fdfa}
.snode.notfeasible{border-color:var(--red);background:#fef2f2}
.snode.noc{border-color:var(--amber);background:#fffbeb}
.snode.rollout{border-color:var(--green);background:#f0fdf4}
.snode.leaf-space{border-color:#9a3412;background:#fff7ed;border-style:dashed}
.snode.leaf-power{border-color:var(--red);background:#fef2f2;border-style:dashed}
.snode.leaf-noc{border-color:var(--amber);background:#fffbeb;border-style:dashed}
.snode.leaf-vendor{border-color:#c2410c;background:#ffedd5;border-style:dashed}
.snode.leaf-assess{border-color:var(--grey);background:#f8fafc;border-style:dashed}
.snode.leaf-both{border-color:var(--red);background:#fef2f2;border-style:dashed}
.snode.leaf-roi{border-color:#7c3aed;background:#f5f3ff;border-style:dashed}
.snode.leaf-grey{border-color:var(--grey);background:#f8fafc;border-style:dashed}
.snode .taction.act-green{background:#dcfce7;color:#166534}
.snode .taction.act-red{background:#fee2e2;color:#991b1b}
.snode .taction.act-amber{background:#fef3c7;color:#92400e}
.snode .taction.act-blue{background:#dbeafe;color:#1e40af}
.snode .taction.act-purple{background:#ede9fe;color:#5b21b6}
.snode .taction.act-grey{background:#f1f5f9;color:#475569}
.tree-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-top:14px;justify-content:center}
.tree-legend span{display:flex;align-items:center;gap:5px}
.tree-legend i{width:14px;height:10px;border-radius:3px;border:2px solid;display:inline-block}

/* charts */
.barwrap{display:flex;align-items:flex-end;gap:10px;height:200px;padding:10px 0;border-bottom:1px solid var(--border)}
.barwrap .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.barwrap .col .stk{width:60%;display:flex;flex-direction:column-reverse}
.barwrap .col .stk div{width:100%}
.barwrap .lbl{font-size:10px;color:var(--muted);margin-top:6px}
.barwrap .val{font-size:10px;font-weight:700;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:780px){.grid2{grid-template-columns:1fr}}
.disclaimer{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px;font-size:12px;color:#9a3412}
.callout{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px;font-size:12px;color:#92400e}

/* roi */
.roi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.roi-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fff;border-left:4px solid var(--grey)}
.roi-card.enhance{border-left-color:var(--green)}.roi-card.operate{border-left-color:var(--blue)}
.roi-card.reject{border-left-color:var(--grey)}.roi-card.pending{border-left-color:var(--amber)}
.roi-card.disclaimer{border-left-color:#9ca3af;background:#fafafa}
.roi-card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.roi-card .hd .pid{font-weight:700;color:var(--navy);font-size:13px}
.roi-card .sc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0;font-size:11px}
.roi-card .sc .s{border:1px solid var(--border);border-radius:6px;padding:6px;text-align:center}
.roi-card .sc .s .h{color:var(--muted);font-size:10px}.roi-card .sc .s .v{font-weight:700;color:var(--navy);font-size:13px;margin-top:2px}
.roi-card .sc .s.win{background:#f0fdf4;border-color:#bbf7d0}
.roi-card .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
.roi-card .next{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px}
.roi-card .next b{color:var(--slate)}
.rec{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.rec.enhance{background:#dcfce7;color:#166534}.rec.operate{background:#dbeafe;color:#1e40af}
.rec.reject{background:#f1f5f9;color:#475569}.rec.pending{background:#fef9c3;color:#854d0e}.rec.disclaimer{background:#f3f4f6;color:#374151}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.lane{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff}
.lane .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.lane .v{font-size:26px;font-weight:700;color:var(--navy);margin:4px 0}
.lane .d{font-size:11px;color:var(--muted)}
.lane.power{border-top:3px solid var(--red)}.lane.space{border-top:3px solid #9a3412}
.lane.noc{border-top:3px solid var(--amber)}.lane.vendor{border-top:3px solid #c2410c}
.lane.max{border-top:3px solid var(--grey)}
/* ============ DRILL-THROUGH MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:780px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:12px 12px 0 0}
.modal-head h3{margin:0;font-size:15px;color:var(--navy)}
.modal-head .close{cursor:pointer;background:none;border:0;font-size:22px;color:var(--muted);padding:0 4px;line-height:1}
.modal-head .close:hover{color:var(--navy)}
.modal-filters{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);align-items:center}
.modal-filters .flbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-right:2px}
.fgrp{display:flex;align-items:center;gap:3px}
.fgrp label{font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:3px 7px;border:1px solid var(--border);border-radius:12px}
.fgrp input{display:none}
.fgrp input:checked+label{background:var(--navy);color:#fff;border-color:var(--navy)}
.modal-body{overflow:auto;flex:1}
.modal table{width:100%;border-collapse:collapse;font-size:12px}
.modal th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--border);z-index:2}
.modal td{padding:7px 10px;border-bottom:1px solid #f1f5f9}
.modal tr:hover td{background:#f8fafc}
.modal .cnt{padding:10px 18px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border)}
.badge-y{color:var(--green);font-weight:700}.badge-n{color:var(--red);font-weight:700}.badge-w{color:#92400e;font-weight:700}
.kpi-big,.kpi-sm,.kpi-cell{cursor:pointer;transition:transform .08s}
.kpi-big:hover,.kpi-sm:hover,.kpi-cell:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* ===== PROJECTIONS: Past vs Upcoming + Vendor Gantt ===== */
.past-vs-up{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.pu-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.pu-card h4{margin:0 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pu-card .big{font-size:34px;font-weight:800;line-height:1;margin:2px 0 8px}
.pu-card.past .big{color:var(--green)} .pu-card.upc .big{color:#2563eb}
.pu-mini{display:flex;align-items:flex-end;gap:5px;height:46px;margin:6px 0 10px}
.pu-mini .b{width:13px;border-radius:3px 3px 0 0}
.pu-card.past .pu-mini .b{background:var(--green)} .pu-card.upc .pu-mini .b{background:#2563eb}
.pu-mini .b.empty{background:var(--border)}
.pu-list{max-height:150px;overflow:auto;border-top:1px solid var(--border);margin-top:8px}
.pu-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0;border-bottom:1px dashed var(--border)}
.pu-row .nm{color:var(--navy);font-weight:600} .pu-row .dt{color:var(--muted)}
.pu-row .vchip{font-size:10px;font-weight:700;color:#fff;background:#8b5cf6;padding:1px 7px;border-radius:10px;margin-left:6px}

function normSpace(v){
  if(v==null) return "unknown";
  const s=String(v).trim().toLowerCase();
  if(["y","yes","available","space  available"].includes(s)) return "Y";
  if(["n","no","not available","not available-common parking","not avaliblity","space not available","not availablity","pod under closer","not available. "].includes(s)) return "N";
  if(["under evaluation","under-evaluation","underevaluation","in evaluation","being evaluated"].includes(s)) return "wip";
  if(["to be confirmed","yet to launch","#n/a","unknown"].includes(s)) return "unknown";
  if(/sq\s*'?ft|sqft|sq\s*fit/.test(s)) return "Y";
  if(s.includes("available") && !s.includes("not")) return "Y";
  if(s.includes("not") && s.includes("avail")) return "N";
  if(s.includes("under eval")) return "wip";   // explicit "Under Evaluation" callout only
  return "unknown";                 // WIP / Pending / other text = NOT under evaluation
}

function normPower(v){
  if(v==null) return "unknown";
  const s=String(v).trim().toLowerCase();
  if(["y","yes"].includes(s)) return "Y";
  if(["n","no"].includes(s)) return "N";
  if(s.includes("under eval")) return "wip";   // explicit "Under Evaluation" callout only
  return "unknown";                 // WIP / Pending / other text = NOT under evaluation
}

function normNoc(v){
  if(v==null) return null;
  const s=String(v).trim().toLowerCase();
  if(["yes","y"].includes(s)) return "Yes";
  if(["no","n"].includes(s)) return "No";
  if(["wip","work in progress","pending"].includes(s)) return "WIP";
  return null;
}
function normCity(v){
  if(v==null) return "";
  const s=String(v).trim();
  const m={gurugram:"Gurgaon","noida 1":"Noida",pune:"Pune",delhi:"Delhi",mumbai:"Mumbai",chennai:"Chennai",bangalore:"Bangalore",hyderabad:"Hyderabad",kolkata:"Kolkata",gurgaon:"Gurgaon",noida:"Noida",faridabad:"Faridabad"};
  return m[s.toLowerCase()] || s;
}
function normDate(v){
  if(v==null) return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s=String(v).trim();
  if(!s || s==="0") return null;
  return s;
}
function within30(iso,today){
  if(!iso) return false;
  const d=new Date(iso);
  if(isNaN(d)) return false;
  const diff=(d-today)/(1000*60*60*24);
  return diff>=0 && diff<=30;
}

function computeKPIs(universe,assessed,roi){
  const asOf=new Date(DATA.as_of);
  const today=new Date();   // real today, for the upcoming-30d window
  const total=universe.length;
  const liveU=universe.filter(p=>p.store_status==="live").length;
  const upcU=universe.filter(p=>p.store_status==="upcoming_live").length;
  const assessedN=assessed.length;
  const notAssessed=total-assessedN;
  // 3-state model:
  //   Evaluated       = BOTH space and power have a concrete value (Y/N)
  //   Under Evaluation= ONLY pods with an explicit "Under Evaluation" callout in space or power
  //   Not Evaluated   = everything else not evaluated (blank/WIP text/no callout, or not in sheet)
  const known=(v)=>v==="Y"||v==="N";
  const pending=(v)=>v==="wip";
  const evaluated=assessed.filter(p=>known(p.space_available)&&known(p.power_available)).length;
  const underEval=assessed.filter(p=>pending(p.space_available)||pending(p.power_available)).length;
  const feasible=assessed.filter(p=>p.feasible).length;
  // Not feasible UNDER EVALUATED = evaluated pods that are not feasible (excludes under/not-evaluated)
  const notFeasEval=evaluated-feasible;
  const spaceOnly=assessed.filter(p=>p.space_available==="N"&&p.power_available==="Y").length;
  const powerOnly=assessed.filter(p=>p.space_available==="Y"&&p.power_available==="N").length;
  const bothBlocked=assessed.filter(p=>p.space_available==="N"&&p.power_available==="N").length;
  const unknownFeas=assessed.filter(p=>p.space_available==="unknown"||p.power_available==="unknown").length;
  // NOC counts are across ALL assessed pods (no feasibility filter)
  // NOC rules: Live pods count NOC only if feasible; Upcoming pods always NOC=Yes.
  const nocYesLive=assessed.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="Yes").length;
  const nocYesUpc=assessed.filter(p=>p.store_status==="upcoming_live").length;
  const nocYes=nocYesLive+nocYesUpc;
  const nocNo=assessed.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="No").length;
  const nocWip=assessed.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="WIP").length;
  // Power overall (kept for reference)
  const powerYes=assessed.filter(p=>p.power_available==="Y").length;
  const powerNo=assessed.filter(p=>p.power_available==="N").length;
  const powerUnknown=assessed.filter(p=>p.power_available==="unknown").length;
  const evLive=assessed.filter(p=>p.ev_live).length;
  // Upcoming 30d = target_go_live present, actual blank, target within 30 days of TODAY (real today)
  const within30Today=(iso)=>{ if(!iso) return false; const d=new Date(iso); if(isNaN(d)) return false; const diff=(d-today)/(1000*60*60*24); return diff>=0 && diff<=30; };
  const upcoming30=assessed.filter(p=>p.target_go_live&&!p.ev_live&&within30Today(p.target_go_live)).length;
  // Upcoming 30d split: live vs upcoming (by store_status)
  const upc30Live=assessed.filter(p=>p.target_go_live&&!p.ev_live&&within30Today(p.target_go_live)&&p.store_status==="live").length;
  const upc30Upc=assessed.filter(p=>p.target_go_live&&!p.ev_live&&within30Today(p.target_go_live)&&p.store_status==="upcoming_live").length;
  // Rejected by Yuma = landlord approved (NOC=Yes) but vendor declined (notes: "Rejected by Vendor")
  const rejectedYuma=assessed.filter(p=>p.noc_status==="Yes"&&p.notes&&/rejected by vendor/i.test(String(p.notes))).length;
  // "Yet to start" = NOC=Yes AND no target_go_live AND no rejection remark in notes
  const yetToStart=assessed.filter(p=>p.noc_status==="Yes"&&!p.target_go_live&&!(p.notes&&/reject/i.test(String(p.notes)))).length;
  const outOfScope=spaceOnly+bothBlocked;
  // "Only Power" = ALL power=Yes pods (irrespective of space); sub-counts by SPACE status: Yes(center) / No(left) / WIP(right)
  const onlyPowerTotal=assessed.filter(p=>p.power_available==="Y").length;
  const onlyPowerYes=assessed.filter(p=>p.power_available==="Y"&&p.space_available==="Y").length;
  const onlyPowerNo=assessed.filter(p=>p.power_available==="Y"&&p.space_available==="N").length;
  const onlyPowerWip=assessed.filter(p=>p.power_available==="Y"&&p.space_available==="unknown").length;
  // "Only Space" = ALL space=Yes pods (irrespective of power); sub-counts by POWER status: Yes(center) / No(left) / WIP(right)
  const onlySpaceTotal=assessed.filter(p=>p.space_available==="Y").length;
  const onlySpaceYes=assessed.filter(p=>p.space_available==="Y"&&p.power_available==="Y").length;
  const onlySpaceNo=assessed.filter(p=>p.space_available==="Y"&&p.power_available==="N").length;
  const onlySpaceWip=assessed.filter(p=>p.space_available==="Y"&&p.power_available==="unknown").length;

  function splitA(fn){
    return {l:assessed.filter(p=>p.store_status==="live"&&fn(p)).length, u:assessed.filter(p=>p.store_status==="upcoming_live"&&fn(p)).length};
  }
  return {
    as_of:DATA.as_of, total, live_universe:liveU, upcoming_universe:upcU,
    assessed:assessedN, not_assessed:notAssessed, evaluated, under_eval:underEval, feasible, not_feas_eval:notFeasEval, space_only:spaceOnly,
    power_only:powerOnly, both_blocked:bothBlocked, unknown_feasibility:unknownFeas,
    power_yes:powerYes, power_no:powerNo, power_unknown:powerUnknown,
    only_space_yes:onlySpaceYes, only_space_wip:onlySpaceWip, only_space_no:onlySpaceNo, only_space_total:onlySpaceTotal,
    only_power_yes:onlyPowerYes, only_power_wip:onlyPowerWip, only_power_no:onlyPowerNo, only_power_total:onlyPowerTotal,
    noc_yes:nocYes, noc_no:nocNo, noc_wip:nocWip, noc_yes_live:nocYesLive, noc_yes_upc:nocYesUpc,
    ev_live:evLive, upcoming_30:upcoming30, upcoming_30_live:upc30Live, upcoming_30_upc:upc30Upc, upcoming_30_live:upc30Live, upcoming_30_upc:upc30Upc,
    rejected_yuma:rejectedYuma, yet_to_start:yetToStart, out_of_scope:outOfScope, power_blocked_roi:roi.length,
    splits:{total:{l:liveU,u:upcU},assessed:splitA(p=>true),feasible:splitA(p=>p.feasible),
      noc_yes:splitA(p=>p.noc_status==="Yes"),ev_live:splitA(p=>p.ev_live)}
  };
}

function parseWorkbook(wb){
  const today=new Date(DATA.as_of);
  // Universe — parsed by header name (robust to added/reordered columns)
  const universe=[];
  const wsU=wb.Sheets["Universe"]; if(!wsU) throw new Error("Universe tab missing");
  const uHdr=(XLSX.utils.sheet_to_json(wsU,{header:1,defval:null,range:0})[0])||[];
  const colU={};
  uHdr.forEach((h,i)=>{ if(h!=null&&String(h).trim()!=="") colU[String(h).trim().toLowerCase()]=i; });
  const gU=(r,name)=>{ const i=colU[name]; return (i!=null)?r[i]:undefined; };
  const uRows=XLSX.utils.sheet_to_json(wsU,{header:1,defval:null,range:2});
  for(const r of uRows){
    const _pid=gU(r,"pod_id");
    if(!_pid||String(_pid).trim()===""||String(_pid).trim().toLowerCase()==="legend") continue;
    var _ss=gU(r,"store_status"); var _ssn=_ss?String(_ss).trim().toLowerCase():"";
    if(_ssn==="upcoming") _ssn="upcoming_live";   // normalize "Upcoming" -> "upcoming_live"
    if(!_ssn) _ssn="live";
    universe.push({pod_id:String(_pid),pod_name:gU(r,"pod_name")||"",city:normCity(gU(r,"city")),
      store_status:_ssn,
      planned_open_date:normDate(gU(r,"planned_open_date")),actual_open_date:normDate(gU(r,"actual_open_date")),
      region_cluster:gU(r,"region_cluster")||""});
  }
  // Assessment — parsed by header name (robust to added/reordered columns, e.g. store_status)
  // Duplicate pod_ids: keep the row with more complete data (prefer one with target_go_live set)
  const assessed=[];
  const assessedMap={};
  const wsA=wb.Sheets["Assessment"]; if(!wsA) throw new Error("Assessment tab missing");
  const aHdr=(XLSX.utils.sheet_to_json(wsA,{header:1,defval:null,range:0})[0])||[];
  const colA={};
  aHdr.forEach((h,i)=>{ if(h!=null&&String(h).trim()!=="") colA[String(h).trim().toLowerCase()]=i; });
  const gA=(r,name)=>{ const i=colA[name]; return (i!=null)?r[i]:undefined; };
  const aRows=XLSX.utils.sheet_to_json(wsA,{header:1,defval:null,range:2});
  for(const r of aRows){
    const _pid=gA(r,"pod_id");
    if(!_pid||String(_pid).trim()===""||String(_pid).trim().toLowerCase()==="legend") continue;
    const pid=String(_pid);
    const space=normSpace(gA(r,"space_available")),power=normPower(gA(r,"power_available"));
    const u=universe.find(x=>x.pod_id===pid)||{};
    var _ss=gA(r,"store_status"); var _ssn=_ss?String(_ss).trim().toLowerCase():"";
    if(_ssn==="upcoming") _ssn="upcoming_live";
    const storeStatus=_ssn||u.store_status||"live";
    const tgl=gA(r,"target_go_live"),agl=gA(r,"actual_go_live");
    const rec={pod_id:pid,pod_name:gA(r,"pod_name")||u.pod_name||"",
      city:normCity(gA(r,"city"))||u.city||"",
      store_status:storeStatus,space_available:space,power_available:power,
      noc_status:normNoc(gA(r,"noc_status")),target_go_live:normDate(tgl),actual_go_live:normDate(agl),
      present_load_kwh:gA(r,"present_load_kwh")||null,required_load_kwh:gA(r,"required_load_kwh")||null,
      notes:gA(r,"notes")||"",
      vendor:gA(r,"vendor")||"",
      feasible:(space==="Y"&&power==="Y"),ev_live:normDate(agl)!=null};
    // duplicate handling: prefer the row with target_go_live set, else keep first
    const prev=assessedMap[pid];
    if(!prev || (rec.target_go_live && !prev.target_go_live)) assessedMap[pid]=rec;
  }
  for(const k in assessedMap) assessed.push(assessedMap[k]);
  // ROI
  const roi=[];
  const wsR=wb.Sheets["ROI"]; if(wsR){
    const rRows=XLSX.utils.sheet_to_json(wsR,{header:1,defval:null,range:2});
    for(const r of rRows){
      if(!r[0]||String(r[0]).trim()===""||String(r[0]).trim().toLowerCase()==="legend") continue;
      roi.push({pod_id:String(r[0]),cdc_govt_charge:r[1]||null,appliance_cost:r[2]||null,
        installation_cost:r[3]||null,cdc_monthly_charge:r[4]||null,
        rider_ev_share_current_pct:r[5]||null,rider_ev_share_target_pct:r[6]||null,
        per_order_ev_saving:r[7]||null,orders_per_rider_month:r[8]||null,
        riders_at_pod:r[9]||null,additional_riders_enabled:r[10]||null});
    }
  }
  return {universe,assessed,roi};
}

function applyData(newData){
  Object.assign(DATA,newData);
  // Rebuild K from DATA
  K.total=DATA.total; K.live=DATA.live_universe; K.upcoming=DATA.upcoming_universe;
  K.assessed=DATA.assessed; K.evaluated=DATA.evaluated; K.underEval=DATA.under_eval; K.feasible=DATA.feasible; K.notFeasEval=DATA.not_feas_eval;
  K.nocApproved=DATA.noc_yes; K.rollout=DATA.ev_live;
  K.nfPower=DATA.power_only; K.nfSpace=DATA.space_only; K.nfBoth=DATA.both_blocked;
  K.notAssessed=DATA.not_assessed; K.nocPending=DATA.noc_wip;
  K.outOfScope=DATA.out_of_scope;
  K.nocYes=DATA.noc_yes; K.nocNo=DATA.noc_no; K.nocWip=DATA.noc_wip;
  K.nocYesLive=DATA.noc_yes_live; K.nocYesUpc=DATA.noc_yes_upc;
  // Station live split under NOC Yes (live + feasible + NOC-Yes pods only)
  K.stationLive=RAW.assessed.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="Yes"&&p.ev_live).length;
  const nl=RAW.assessed.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="Yes"&&!p.ev_live);
  K.stationNotLive=nl.length;
  K.nlVendorDenied=nl.filter(p=>/rejected by vendor/i.test(String(p.notes||""))).length;
  const nlRest=nl.filter(p=>!/rejected by vendor/i.test(String(p.notes||"")));

/* ============ CITY FILTER ============ */
let RAW={universe:[],assessed:[],roi:[]};      // current parsed pod-level data
let CITY="All";                                // selected region filter: All | Top4 | Top7
const TOP4=["Delhi","Gurgaon","Noida","Mumbai","Bangalore","Hyderabad"];      // NCR=Delhi+Gurgaon+Noida
const TOP7=[...TOP4,"Kolkata","Pune","Chennai"];
function normCityKey(c){ if(!c) return ""; const s=String(c).trim(); const m={gurugram:"Gurgaon","noida 1":"Noida",pune:"Pune",delhi:"Delhi",mumbai:"Mumbai",chennai:"Chennai",bangalore:"Bangalore",hyderabad:"Hyderabad",kolkata:"Kolkata",gurgaon:"Gurgaon",noida:"Noida",faridabad:"Faridabad"}; return m[s.toLowerCase()]||s; }
function inRegion(p,region){
  if(region==="All") return true;
  const c=normCityKey(p.city);
  return region==="Top4" ? TOP4.includes(c) : TOP7.includes(c);
}
function populateCities(){
  // options are static (All / Top 4 / Top 7); keep selection stable after upload
  const sel=document.getElementById("cityFilter");
  sel.value=["All","Top4","Top7"].includes(sel.value)?sel.value:"All";
}
function recompute(){
  const region=CITY;
  const u = RAW.universe.filter(p=>inRegion(p,region));
  const a = RAW.assessed.filter(p=>inRegion(p,region));
  const r = RAW.roi.filter(p=>inRegion(p,region));
  const kpis=computeKPIs(u,a,r);
  applyData(kpis);
}
// init RAW from seed
RAW={universe:RAW_SEED.universe.slice(),assessed:RAW_SEED.assessed.slice(),roi:RAW_SEED.roi.slice()};

/* ============ DRILL-THROUGH ============ */
// Map a tile click to the set of pods it represents (respects current region filter)
function cityUniverse(){ return RAW.universe.filter(p=>inRegion(p,CITY)); }
function cityAssessed(){ return RAW.assessed.filter(p=>inRegion(p,CITY)); }
function podsForTile(key){
  const u=cityUniverse(), a=cityAssessed();
  const today=new Date();
  const w30=(iso)=>{ if(!iso) return false; const d=new Date(iso); if(isNaN(d)) return false; const diff=(d-today)/(1000*60*60*24); return diff>=0&&diff<=30; };
  switch(key){
    case "universe": return u.map(p=>{const as=a.find(x=>x.pod_id===p.pod_id)||{};return {...p,...as,noc_status:as.noc_status||null};});
    case "live": return a.filter(p=>p.store_status==="live");
    case "upcoming_uni": return u.filter(p=>p.store_status==="upcoming_live");
    case "evaluated": return a.filter(p=>(p.space_available==="Y"||p.space_available==="N")&&(p.power_available==="Y"||p.power_available==="N"));
    case "underEval": return a.filter(p=>p.space_available==="wip"||p.power_available==="wip");
    case "noteval": return u.filter(p=>{const as=a.find(x=>x.pod_id===p.pod_id);const started=as&&(((as.space_available==="Y"||as.space_available==="N")&&(as.power_available==="Y"||as.power_available==="N"))||as.space_available==="wip"||as.power_available==="wip");return !started;}).map(p=>{const as=a.find(x=>x.pod_id===p.pod_id)||{};return {...p,...as,noc_status:as.noc_status||null};});
    case "feasible": return a.filter(p=>p.feasible);
    case "notFeasEval": return a.filter(p=>!p.feasible&&(p.space_available!=="unknown"||p.power_available!=="unknown"));
    case "notFeasEval": return a.filter(p=>!p.feasible&&(p.space_available!=="unknown"||p.power_available!=="unknown"));
    case "onlyPower": return a.filter(p=>p.power_available==="Y");
    case "onlySpace": return a.filter(p=>p.space_available==="Y");
    case "nocYes": return a.filter(p=>(p.store_status==="live"&&p.feasible&&p.noc_status==="Yes")||p.store_status==="upcoming_live");
    case "station_live": return a.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="Yes"&&p.ev_live);
    case "station_notlive": return a.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="Yes"&&!p.ev_live);
    case "nl_wip": return a.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="Yes"&&!p.ev_live&&!/rejected by vendor/i.test(String(p.notes||""))&&p.target_go_live&&w30(p.target_go_live));
    case "nl_vden": return a.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="Yes"&&!p.ev_live&&/rejected by vendor/i.test(String(p.notes||"")));
    case "noc_upcoming": return a.filter(p=>p.store_status==="upcoming_live");
    case "noc_yts": return a.filter(p=>p.noc_status==="Yes"&&!p.target_go_live&&!(p.notes&&/reject/i.test(String(p.notes))));
    case "nocNo": return a.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="No");
    case "nocWip": return a.filter(p=>p.store_status==="live"&&p.feasible&&p.noc_status==="WIP");
    case "liveEv": return a.filter(p=>p.ev_live);
    case "upcoming30": return a.filter(p=>p.target_go_live&&!p.ev_live&&w30(p.target_go_live));
    case "rejectedYuma": return a.filter(p=>p.noc_status==="Yes"&&p.notes&&/rejected by vendor/i.test(String(p.notes)));
    case "yetToStart": return a.filter(p=>p.noc_status==="Yes"&&!p.target_go_live&&!(p.notes&&/reject/i.test(String(p.notes))));
    default: return a;
  }
}
function openModal(title,key){
  const pods=podsForTile(key);
  // single filter: City only
  let fc="all";
  const renderTable=()=>{
    const f=pods.filter(p=>fc==="all"||p.city===fc);
    const b=(v)=>v==="Y"?'<span class="badge-y">Y</span>':v==="N"?'<span class="badge-n">N</span>':v==="wip"?'<span class="badge-w">WIP</span>':'<span style="color:var(--muted2)">—</span>';
    const nocDisp=(p)=>{ if(p.store_status==="upcoming_live") return '<span class="badge-y">Yes</span>'; const v=p.noc_status; return v==="Yes"?'<span class="badge-y">Yes</span>':v==="No"?'<span class="badge-n">No</span>':v==="WIP"?'<span class="badge-w">WIP</span>':'<span style="color:var(--muted2)">—</span>'; };
    const rows=f.map(p=>`<tr><td><b>${p.pod_id||"—"}</b></td><td>${p.pod_name||"—"}</td><td>${p.city||"—"}</td><td>${p.store_status==="upcoming_live"?"<span style=color:#2563eb>upcoming</span>":"live"}</td><td>${b(p.space_available)}</td><td>${b(p.power_available)}</td><td>${nocDisp(p)}</td><td>${p.target_go_live||"—"}</td><td style="font-size:11px">${(p.notes||"").slice(0,40)}</td></tr>`).join("");
    return `<div class="cnt">${f.length} pod(s)${f.length!==pods.length?" (of "+pods.length+" after filter)":""}</div>
      <table><thead><tr><th>Pod ID</th><th>Name</th><th>City</th><th>Store</th><th>Space</th><th>Power</th><th>NOC</th><th>Target go-live</th><th>Notes</th></tr></thead><tbody>${rows||'<tr><td colspan=9 style=text-align:center;color:var(--muted)>No pods match the filter</td></tr>'}</tbody></table>`;
  };
  const filterBar=()=>{
    const cities=[...new Set(pods.map(p=>p.city).filter(Boolean))].sort();
    return `<div class="modal-filters">
      <span class="flbl">City</span>
      <select id="fCity" onchange="window.__modalCity=this.value" style="cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:20px;background:#fff;color:var(--navy);font-weight:600;font-size:12px;max-width:220px">
        <option value="all">All cities</option>
        ${cities.map(c=>`<option value="${c}" ${fc===c?"selected":""}>${c}</option>`).join("")}
      </select>
    </div>`;
  };
  const root=document.getElementById("modalRoot");
  const draw=()=>{ root.innerHTML=`<div class="modal-overlay" id="ovl"><div class="modal"><div class="modal-head"><h3>${title}</h3><span class="close" id="mclose">×</span></div>${filterBar()}<div class="modal-body" id="mbody">${renderTable()}</div></div></div>`;
    document.getElementById("mclose").onclick=()=>{root.innerHTML="";window.__modalCity="all";};
    document.getElementById("ovl").onclick=(e)=>{if(e.target.id==="ovl"){root.innerHTML="";window.__modalCity="all";}};
    // city filter: re-render table only, keep the dropdown selection
    document.getElementById("fCity").onchange=(e)=>{ fc=e.target.value; const body=document.getElementById("mbody"); body.innerHTML=renderTable(); };
  };
  window.__modalCity="all";
  draw();
}

/* ============ SVG TREE ============ */
function treeHTML(){
  const TREE={
    id:'root',name:'Total Pods',count:K.total,sub:`${K.live} live · ${K.upcoming} upc`,type:'root',
    children:[
      {id:'evaluated',name:'Evaluated',count:K.evaluated,sub:pct(K.evaluated,K.total)+' of total',type:'assessed',children:[
        {id:'feasible',name:'Feasible',sub2:'space+power ✓',count:K.feasible,sub:pct(K.feasible,K.evaluated)+' of eval',type:'feasible',children:[
          {id:'noc_ok',name:'NOC Approved',count:K.nocApproved,sub:pct(K.nocApproved,K.feasible)+' of feas',type:'noc',children:[
            {id:'station_live',name:'Station Live',count:K.stationLive,sub:pct(K.stationLive,K.nocApproved)+' of NOC ✓',type:'rollout',action:'→ Final Rollout',actionCls:'act-green'},
            {id:'station_notlive',name:'Station Not Live',count:K.stationNotLive,sub:pct(K.stationNotLive,K.nocApproved)+' of NOC ✓',type:'noc',children:[
              {id:'nl_wip',name:'Work In Progress',sub2:'within 30d live target',count:K.nlWip,sub:'matches Upcoming tile',type:'leaf-noc',action:'→ 30d live / start',actionCls:'act-amber'},
              {id:'nl_vden',name:'Vendor Denied',sub2:'rejected by vendor',count:K.nlVendorDenied,sub:'of not live',type:'leaf-vendor',action:'→ Reassign vendor',actionCls:'act-amber'}
            ]},
            {id:'noc_upcoming',name:'Upcoming',sub2:'NOC always Yes',count:K.nocYesUpc,sub:'of NOC ✓',type:'noc',action:'→ Go-live plan',actionCls:'act-blue'},
            {id:'noc_yts',name:'Yet to Start',sub2:'NOC Yes · no target',count:K.yetToStart,sub:'no go-live set',type:'leaf-noc',action:'→ Set go-live',actionCls:'act-amber'}
          ]},
          {id:'noc_declined',name:'NOC No / WIP',count:K.nocNo+'/'+K.nocWip,sub:'of feasible',type:'leaf-noc',action:'→ NOC acceleration',actionCls:'act-amber'}
        ]},
        {id:'notfeas',name:'Not Feasible',count:K.notFeasEval,sub:pct(K.notFeasEval,K.evaluated)+' of eval',type:'notfeasible',children:[
          {id:'space',name:'Space Blocked',count:K.nfSpace,type:'leaf-space',action:'→ Re-site',actionCls:'act-red'},
          {id:'power',name:'Power Blocked',count:K.nfPower,type:'leaf-power',action:'→ split on vendor',children:[
            {id:'power_v',name:'+ Vendor Interest',count:K.nfPowerV,type:'leaf-roi',action:'→ ROI calc',actionCls:'act-purple'},
            {id:'power_nv',name:'No Vendor',count:K.nfPowerNV,type:'leaf-grey',action:'→ Source vendor',actionCls:'act-grey'}
          ]},
          {id:'both',name:'Both Blocked',count:K.nfBoth,type:'leaf-both',action:'→ Deprioritize',actionCls:'act-red'}
        ]}
      ]},
      {id:'under_eval',name:'Under Evaluation',sub2:'explicit callout',count:K.underEval,sub:pct(K.underEval,K.total)+' of total',type:'leaf-assess',action:'→ Await RE check',actionCls:'act-blue'},
      {id:'not_eval',name:'Not Evaluated',count:K.total-K.evaluated-K.underEval,sub:pct(K.total-K.evaluated-K.underEval,K.total)+' of total',type:'leaf-assess',action:'→ Complete assessment',actionCls:'act-blue'}
    ]
  };
  let leafCounter=0,maxLevel=0,numLeaves=0;
  function layout(n,level){
    n.level=level;if(level>maxLevel)maxLevel=level;
    if(!n.children||!n.children.length){n.xs=leafCounter++;numLeaves++;}
    else{n.children.forEach(c=>layout(c,level+1));n.xs=(n.children[0].xs+n.children[n.children.length-1].xs)/2;}
  }
  layout(TREE,0);
  const nodeW=158,nodeH=82,xGap=14,yGap=48,pad=22;
  const xPix=s=>pad+s*(nodeW+xGap);
  const yPix=l=>pad+l*(nodeH+yGap);
  const W=pad*2+numLeaves*(nodeW+xGap)-xGap;
  const H=pad*2+(maxLevel+1)*nodeH+maxLevel*yGap;
  let nodes='',conns='';
  function nodeHTML(n){
    const x=xPix(n.xs),y=yPix(n.level);
    nodes+=`<foreignObject x="${x}" y="${y}" width="${nodeW}" height="${nodeH}"><div xmlns="http://www.w3.org/1999/xhtml" class="snode ${n.type||''}"><div class="tname">${n.name}</div>${n.sub2?`<div class="tsub2">${n.sub2}</div>`:''}<div class="tcount">${n.count}</div>${n.sub?`<div class="tconv">${n.sub}</div>`:''}${n.action?`<div class="taction ${n.actionCls||''}">${n.action}</div>`:''}</div></foreignObject>`;
    if(n.children){n.children.forEach(c=>{
      const cx=xPix(c.xs),cy=yPix(c.level),midY=y+nodeH+(cy-(y+nodeH))/2;
      const cls=(c.type||'').startsWith('leaf')?'tlink tlink-act':'tlink';
      conns+=`<path d="M ${x+nodeW/2} ${y+nodeH} V ${midY} H ${cx+nodeW/2} V ${cy}" class="${cls}"/>`;
      nodeHTML(c);
    });}
  }
  nodeHTML(TREE);
  return `<div class="tree-wrap"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:none">${conns}${nodes}</svg></div>
  <div class="tree-legend">
    <span><i style="border-color:var(--navy);background:#0b2545"></i>Root</span>
    <span><i style="border-color:var(--blue);background:#eff6ff"></i>Assessed</span>
    <span><i style="border-color:var(--teal);background:#f0fdfa"></i>Feasible</span>
    <span><i style="border-color:var(--red);background:#fef2f2"></i>Not feasible</span>
    <span><i style="border-color:var(--amber);background:#fffbeb"></i>NOC stage</span>
    <span><i style="border-color:var(--green);background:#f0fdf4"></i>Final rollout ✓</span>
    <span><i style="border-color:#9a3412;background:#fff7ed"></i>Leaf = action needed</span>
  </div>`;
}

function renderT1(){
  // Per-pod launch data from the Assessment sheet (actual_go_live = past, target_go_live = upcoming)
  const A=(RAW&&RAW.assessed)?RAW.assessed:[];
  const past=A.filter(p=>p.actual_go_live).sort((a,b)=>String(a.actual_go_live).localeCompare(String(b.actual_go_live)));
  const upc =A.filter(p=>!p.actual_go_live && p.target_go_live).sort((a,b)=>String(a.target_go_live).localeCompare(String(b.target_go_live)));
  const hasDates = past.length>0 || upc.length>0;

  // Build a 12-month window ending 6 months ahead for the combined timeline + gantt
  const dNow=new Date(); dNow.setDate(1);
  const months=[];
  for(let i=-5;i<=6;i++){ const m=new Date(dNow.getFullYear(),dNow.getMonth()+i,1); months.push(m); }
  const mKey=m=>`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}`;
  const mLabel=m=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m.getMonth()]+" '"+String(m.getFullYear()).slice(2);

  // Monthly counts: past (actual) and upcoming (target)
  const pastM={}, upcM={};
  past.forEach(p=>{ const k=(String(p.actual_go_live).slice(0,7)); pastM[k]=(pastM[k]||0)+1; });
  upc.forEach(p=>{ const k=(String(p.target_go_live).slice(0,7)); upcM[k]=(upcM[k]||0)+1; });
  const maxM=Math.max(1,...months.map(m=>Math.max(pastM[mKey(m)]||0,upcM[mKey(m)]||0)));

  // Gantt: pods with dates, last 6 → next 6 months on the timeline
  const gantt=[...past.map(p=>({...p,date:p.actual_go_live,kind:'past'})),

        ${past.length>40?`<div class="small muted" style="margin-top:6px">+${past.length-40} more…</div>`:''}
      </div>
      <div class="pu-card upc">
        <h4>Upcoming Launches (target go-live)</h4>
        <div class="big">${upc.length}</div>
        <div class="small muted">pods planned to open</div>

    <div class="comb-tl">

      ${ nowIdx>=0 ? `<div style="position:relative;height:2px"><div style="position:absolute;left:${(nowIdx+0.5)/span*100}%;top:-58px;width:2px;height:60px;background:#dc2626"></div><div style="position:absolute;left:${(nowIdx+0.5)/span*100}%;transform:translateX(-50%);top:-66px;font-size:8px;color:#dc2626;font-weight:700">now</div></div>`:'' }
    </div>

    <!-- Vendor Gantt chart -->

    <div class="timeline-leg"><span><i style="background:var(--green)"></i>Past (actual)</span><span><i style="background:#2563eb"></i>Upcoming (target)</span><span><i style="background:#8b5cf6;border-radius:6px"></i>Vendor assigned</span><span style="color:var(--muted)">Blank vendor = TBD (fill in Assessment sheet)</span></div>

        <tbody>
        ${ gantt.length ? gantt.map(p=>{
          const k=String(p.date).slice(0,7); const idx=months.findIndex(m=>mKey(m)===k);
          let barPos=-1;
          if(idx>=0){ barPos=(idx+0.5)/span*100; }
          const pctStr = barPos>=0 ? `left:${Math.max(0,barPos-6)}%;width:12%` : `left:0;width:0`;
          const vchip = p.vendor ? `<span class="vchip">${p.vendor}</span>` : `<span class="vempty">TBD</span>`;
          const st = p.kind==='past' ? '<span class="pos">past</span>' : '<span style="color:#2563eb">upcoming</span>';
          const barCls = p.kind==='past'?'past':'upcoming';
          return `<tr><td><b>${p.pod_id||'—'}</b><br><span class="muted small">${(p.pod_name||'').slice(0,24)}</span></td><td>${p.city||'—'}</td><td>${st}</td><td>${vchip}</td><td>${p.date||'—'}</td><td class="tl-cell"><div class="tl-grid">${months.map(()=>'<div class="div"></div>').join('')}</div>${idx>=0?`<div class="gantt-bar ${barCls}" style="${pctStr}" title="${p.pod_name||p.pod_id} · ${p.date}">${p.vendor||p.kind}</div>`:'<span class="muted small">outside window</span>'}</td></tr>`;
        }).join('') : `<tr><td colspan="6" class="gantt-empty"><b>No launch dates found.</b><br>Enter <code>actual_go_live</code> (past) or <code>target_go_live</code> (upcoming) in the Assessment sheet, then re-upload. Vendor names in the <code>vendor</code> column will appear as purple chips.</td></tr>` }

}

function roiCard(r){
  if(r.rec==='pending') return `<div class="roi-card pending"><div class="hd"><span class="pid">${r.pod_id} · ${r.pod_name}</span><span class="rec pending">pending</span></div><div class="small muted">${r.city} · planned total ${r.total} kWh (enh ${r.enh} kWh)</div><div class="callout" style="margin-top:8px">⚠ ${r.next}</div><div style="font-size:11px;color:var(--muted);margin-top:6px"><b>Owner:</b> ${r.owner} · <b>Due:</b> ${r.due}</div></div>`;

  const win={enhance:'A',operate:'B',reject:'C'}[r.rec];
  return `<div class="roi-card ${r.rec}">
    <div class="hd"><span class="pid">${r.pod_id} · ${r.pod_name}</span><span class="rec ${r.rec}">${r.rec}</span></div>

}

document.getElementById('nav').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const t=+e.target.dataset.t;
  document.querySelectorAll('section.tab').forEach((s,i)=>s.classList.toggle('active',i===t));
  renderers[t]();
});
